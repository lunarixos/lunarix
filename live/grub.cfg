set default=0
set timeout=3

insmod all_video
set gfxpayload=keep
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry 'Lunarix Live' {
    search --no-floppy --label --set=root LUNARIX_LIVE
    linux /boot/vmlinuz console=ttyS0,115200n8 console=tty0 loglevel=3
    initrd /boot/live.cpio.gz
}

menuentry 'Lunarix Live (serial)' {
    search --no-floppy --label --set=root LUNARIX_LIVE
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 loglevel=3
    initrd /boot/live.cpio.gz
}
